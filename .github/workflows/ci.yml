name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - uses: actions/setup-node@v4
        with: { node-version: '24.x' }
      - run: dotnet restore Ripmedia.sln
      - run: dotnet build Ripmedia.sln --configuration Release --no-restore
      - run: dotnet test Ripmedia.sln --configuration Release --no-restore
      - run: dotnet publish src/Ripmedia.Cli/Ripmedia.Cli.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true --output artifacts/app
      - run: dotnet publish src/Ripmedia.Launcher/Ripmedia.Launcher.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true --output artifacts/launcher
      - run: artifacts/app/ripmedia.exe version
      - run: if (-not (Test-Path artifacts/launcher/ripmedia-launcher.exe)) { throw 'Published launcher is missing.' }
